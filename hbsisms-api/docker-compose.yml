# Local PostgreSQL for development. Values come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: hbsisms-postgres
    environment:
      POSTGRES_DB: hbsisms
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d hbsisms"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
